# auditlog 组合服务配置：单进程同时提供 gRPC 与 HTTP
# 启动方式（在 auditlog/server 目录下）：go run server.go -f etc/auditlog.yaml
#
# 安全约定：
#   1. 凭证一律通过环境变量注入（${VAR} 占位在加载时替换），禁止在本文件写明文密码；
#   2. TLS 私钥（*-key.pem）不入库，本地用 bash ../deploy/tls/gen.sh 生成，
#      生产环境经 k8s Secret 挂载。

Name: auditlog

# 日志配置：console 输出、json 编码、info 级别
Log:
  ServiceName: auditlog
  Mode: console
  Encoding: json
  Level: info

# ---------------- MySQL 数据源 ----------------
# 由环境变量 AUDITLOG_MYSQL_DATASOURCE 注入完整 DSN，形如：
#   auditlog_app:<password>@tcp(127.0.0.1:3306)/auditlog?charset=utf8mb4&parseTime=true&loc=Local&timeout=3000ms&readTimeout=3000ms&writeTimeout=3000ms
# 本地调试示例（勿用于生产）：
#   export AUDITLOG_MYSQL_DATASOURCE='root:root@tcp(127.0.0.1:3306)/auditlog?charset=utf8mb4&parseTime=true&loc=Local'
Mysql:
  DataSource: ${AUDITLOG_MYSQL_DATASOURCE}

# ---------------- gRPC 服务端 ----------------
Rpc:
  ListenOn: 127.0.0.1:9080
  Timeout: 5000
  CpuThreshold: 900
  Health: true
  # 启动后注册到 etcd，key 为下游服务发现使用的固定标识
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: auditlog.rpc
  # gRPC mTLS：CACertFile 非空时强制校验客户端证书（双向认证）；路径相对于 server 工作目录
  TLS:
    CertFile: ../deploy/tls/server.pem
    KeyFile: ../deploy/tls/server-key.pem
    CACertFile: ../deploy/tls/ca.pem

# ---------------- HTTP 服务端 ----------------
# 注意：HTTP 入口与 gRPC 入口共享 internal/core 业务实现（进程内直调），
# 不存在 HTTP -> gRPC 的本机回环链路，因此无需配置回环客户端证书。
Http:
  Host: 127.0.0.1
  Port: 8080
  Timeout: 5000
  MaxConns: 10000
  # 请求体大小上限（字节），防止超大 body 打爆内存/数据库
  MaxBytes: 1048576
  # HTTPS 服务端证书；配置后即启用 HTTPS，路径相对于 server 工作目录
  CertFile: ../deploy/tls/server.pem
  KeyFile: ../deploy/tls/server-key.pem
  # 调用方客户端证书 CA：非空时 HTTP 升级为 mTLS（RequireAndVerifyClientCert）
  ClientCACertFile: ../deploy/tls/ca.pem

# ---------------- 管理端口（明文 HTTP，专供 k8s 探针，不启用 mTLS） ----------------
# /healthz  liveness：进程存活即 200
# /readyz   readiness：必需依赖（MySQL）就绪才 200，启动中/依赖故障返回 503
# /status   状态详情（starting/ready/stopping + 各依赖组件状态）
# k8s kubelet 探针不携带业务客户端证书，因此该端口必须与 mTLS 业务端口隔离；
# /status 含内部依赖信息，部署时保持仅集群内可达（勿经 Ingress/负载均衡对外暴露）。
Admin:
  Host: 127.0.0.1
  Port: 8081
